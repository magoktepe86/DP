    #searchInput::placeholder { color: #8888a0; }
    #searchInput:focus { border-color: #d4a574; background: rgba(255, 255, 255, 0.12); box-shadow: 0 0 20px rgba(212, 165, 116, 0.25); }

    .tabs { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); color: #b8b8d0; padding: 0.75rem 2rem; border-radius: 50px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.3px; backdrop-filter: blur(8px); }
    .tab-btn:hover { background: rgba(255, 255, 255, 0.12); color: #e0e0f0; border-color: rgba(255, 255, 255, 0.2); }
    .tab-btn.active { background: linear-gradient(135deg, #d4a574, #c49464); color: #1e1e2f; border-color: transparent; font-weight: 600; box-shadow: 0 8px 25px rgba(212, 165, 116, 0.35); }

    .table-container { background: rgba(255, 255, 255, 0.04); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); overflow: hidden; backdrop-filter: blur(12px); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4); display: none; max-height: 600px; overflow-y: auto; }
    .table-container.active { display: block; animation: fadeUp 0.4s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    table { width: 100%; border-collapse: collapse; }
    thead th { background: rgba(212, 165, 116, 0.15); color: #f5d6b4; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; padding: 1.2rem 1.5rem; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.08); position: sticky; top: 0; backdrop-filter: blur(10px); z-index: 2; }
    tbody td { padding: 0.8rem 1.5rem; color: #d0d0e0; font-size: 0.92rem; border-bottom: 1px solid rgba(255, 255, 255, 0.04); transition: background 0.2s; }
    tbody tr:hover td { background: rgba(212, 165, 116, 0.08); }
    tbody tr:last-child td { border-bottom: none; }

    .code-badge { display: inline-block; background: linear-gradient(135deg, rgba(212, 165, 116, 0.25), rgba(212, 165, 116, 0.1)); color: #f5d6b4; padding: 0.35rem 0.9rem; border-radius: 8px; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.5px; border: 1px solid rgba(212, 165, 116, 0.2); min-width: 65px; text-align: center; }

    .perfume-info { display: flex; align-items: center; gap: 12px; cursor: pointer; transition: transform 0.2s; }
    .perfume-info:hover { transform: scale(1.02); }
    .perfume-img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; background: #1e1e2f; border: 1px solid rgba(212, 165, 116, 0.3); flex-shrink: 0; transition: border-color 0.3s; }
    .perfume-info:hover .perfume-img { border-color: #d4a574; }
    
    .perfume-text { display: flex; flex-direction: column; }
    .original-name { color: #e8e8f0; font-weight: 500; }
    .original-brand { color: #a0a0b8; font-size: 0.82rem; margin-top: 2px; }
    .similarity { display: inline-block; background: rgba(100, 220, 150, 0.15); color: #7ed6a0; padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }

    .info-note { text-align: center; margin-top: 2rem; color: #707088; font-size: 0.85rem; line-height: 1.7; padding: 1.5rem; background: rgba(255, 255, 255, 0.02); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .info-note strong { color: #d4a574; font-weight: 600; }
    .count-badge { display: inline-block; background: rgba(212, 165, 116, 0.2); color: #d4a574; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; margin-left: 0.5rem; font-weight: 600; vertical-align: middle; }

    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; }
    .modal.show { display: flex; opacity: 1; }
    .modal-content { background: #2a2a40; padding: 2rem; border-radius: 20px; border: 1px solid rgba(212, 165, 116, 0.3); box-shadow: 0 25px 60px rgba(0,0,0,0.6); text-align: center; max-width: 90%; width: 400px; position: relative; transform: translateY(-20px); transition: transform 0.3s ease; }
    .modal.show .modal-content { transform: translateY(0); }
    
    .close-btn { position: absolute; top: 15px; right: 20px; color: #a0a0b8; font-size: 1.8rem; font-weight: bold; cursor: pointer; transition: color 0.2s; line-height: 1; }
    .close-btn:hover { color: #fff; }

    .modal-img { width: 200px; height: 200px; border-radius: 12px; object-fit: cover; border: 2px solid rgba(212, 165, 116, 0.4); margin: 1rem auto; display: block; background: #1e1e2f; }
    .modal-title { color: #f5d6b4; font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
    .modal-brand { color: #a0a0b8; font-size: 0.9rem; margin-bottom: 1.5rem; }

    .google-btn { display: inline-block; background: linear-gradient(135deg, #d4a574, #c49464); color: #1e1e2f; text-decoration: none; padding: 0.8rem 1.5rem; border-radius: 50px; font-weight: 600; font-size: 0.9rem; transition: all 0.3s; width: 100%; box-sizing: border-box; box-shadow: 0 4px 15px rgba(212, 165, 116, 0.3); }
    .google-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 165, 116, 0.5); }

  function handleImageError(imgElement, name, brand) {
    const safeName = name.length > 12 ? name.substring(0, 10) + '..' : name;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
      <rect width="100" height="100" fill="#1e1e2f"/>

    imgElement.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    imgElement.onerror = null;

  function openModal(code, original, brand, imgSrc) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const modalTitle = document.getElementById('modalTitle');
    const modalBrand = document.getElementById('modalBrand');
    const modalSearchBtn = document.getElementById('modalSearchBtn');

    modalTitle.textContent = original;
    modalBrand.textContent = brand !== '—' ? brand : '';

    modalImg.src = imgSrc;
    modalImg.onerror = function() {
      const safeName = original.length > 12 ? original.substring(0, 10) + '..' : original;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">

        <rect x="50" y="40" width="100" height="120" rx="15" fill="none" stroke="#d4a574" stroke-width="3"/>

      </svg>`;
      this.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      this.onerror = null;

          <rect x="40" y="10" width="20" height="15" rx="3" fill="#d4a574"/>
          <text x="50" y="55" font-family="Arial" font-size="12" fill="#d4a574" text-anchor="middle" font-weight="bold">${safeName}</text>
        </svg>`;
        displayImg = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }

      tr.innerHTML = `
        <td><span class="code-badge">${item.code}</span></td>
        <td>
          <div class="perfume-info" onclick="openModal('${item.code}', '${item.original}', '${item.brand}', '${displayImg}')">
            <img src="${displayImg}" alt="${item.original}" class="perfume-img" onerror="handleImageError(this, '${item.original}', '${item.brand}')">
            <div class="perfume-text">
              <span class="original-name">${item.original}</span>
              ${item.brand !== '—' ? `<span class="original-brand">${item.brand}</span>` : ''}
            </div>
          </div>
        </td>
        <td>${item.sim !== '—' ? `<span class="similarity">${item.sim}</span>` : '<span style="color:#606080;">—</span>'}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  updateCounts();
  renderTable('kadin');

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderTable(currentTab);
  });

  const tabBtns = document.querySelectorAll('.tab-btn');
  const tables = {
    kadin: document.getElementById('table-kadin'),
    erkek: document.getElementById('table-erkek'),
    unisex: document.getElementById('table-unisex')
  };

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      Object.values(tables).forEach(t => t.classList.remove('active'));
      tables[currentTab].classList.add('active');
      renderTable(currentTab); 
    });
  });
</script>

</body>
</html>
